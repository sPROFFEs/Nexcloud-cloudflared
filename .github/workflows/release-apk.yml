name: Build and Release APK

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+-cf[0-9]+'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                persist-credentials: false

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 21

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run fork tests and build APK
              run: |
                ./gradlew --dependency-verification=lenient --no-configuration-cache \
                    :app:assembleGplayDebug :app:testGplayDebugUnitTest \
                    --tests 'com.nextcloud.client.network.cloudflare.*' \
                    --tests 'com.nextcloud.client.updater.*'

            - name: Sign and verify APK
              env:
                KEYSTORE_BASE64: ${{ secrets.CLOUDFLARED_KEYSTORE_BASE64 }}
                KEYSTORE_PASSWORD: ${{ secrets.CLOUDFLARED_KEYSTORE_PASSWORD }}
                EXPECTED_CERT: ${{ vars.CLOUDFLARED_CERT_SHA256 }}
              run: |
                : "${KEYSTORE_BASE64:?Missing CLOUDFLARED_KEYSTORE_BASE64 secret}"
                : "${KEYSTORE_PASSWORD:?Missing CLOUDFLARED_KEYSTORE_PASSWORD secret}"
                : "${EXPECTED_CERT:?Missing CLOUDFLARED_CERT_SHA256 variable}"
                sdkmanager 'build-tools;37.0.0'
                build_tools="$ANDROID_HOME/build-tools/37.0.0"
                keystore=$(mktemp)
                trap 'rm -f "$keystore"' EXIT
                printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
                mkdir -p dist
                apk=dist/app-gplay-debug.apk
                "$build_tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
                    --ks-key-alias nextcloud-cloudflared --v4-signing-enabled false --out "$apk" \
                    app/build/outputs/apk/gplay/debug/app-gplay-debug.apk
                certificates=$("$build_tools/apksigner" verify --print-certs "$apk")
                actual_cert=$(sed -En 's/^(V[0-9.]+ )?Signer( #[0-9]+)?:? certificate SHA-256 digest: //p' \
                    <<< "$certificates" | sort -u)
                if [[ "$actual_cert" != "$EXPECTED_CERT" ]]; then
                    echo 'APK signing certificate does not match CLOUDFLARED_CERT_SHA256' >&2
                    exit 1
                fi
                if [[ "$GITHUB_REF_TYPE" == tag ]]; then
                    badging=$("$build_tools/aapt" dump badging "$apk")
                    version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$badging")
                    if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
                        echo 'Release tag does not match APK versionName' >&2
                        exit 1
                    fi
                fi
                (cd dist && sha256sum app-gplay-debug.apk > app-gplay-debug.apk.sha256)

            - name: Upload APK for verification
              uses: actions/upload-artifact@v4
              with:
                name: nextcloud-cloudflared-apk
                path: |
                    dist/app-gplay-debug.apk
                    dist/app-gplay-debug.apk.sha256
                if-no-files-found: error

            - name: Create GitHub Release
              if: github.ref_type == 'tag'
              uses: softprops/action-gh-release@v2
              with:
                files: |
                    dist/app-gplay-debug.apk
                    dist/app-gplay-debug.apk.sha256
                fail_on_unmatched_files: true
                generate_release_notes: true
                make_latest: true
                body: |
                    Si tienes instalada `v3.31.0-cf1` o `v3.31.0-cf2`, desinstálala antes de instalar este APK.
                    Guarda los cambios locales pendientes.
                    Tras reinstalar, vuelve a configurar tu cuenta y Cloudflare Access.
                    Las próximas versiones podrán instalarse como actualizaciones con el mismo certificado.
