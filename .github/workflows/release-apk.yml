name: "Build and Release APK"

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Release tag (e.g. v3.31.0-cf1)'
                required: false
                default: ''
            release_title:
                description: 'Release title'
                required: false
                default: ''

permissions:
    contents: write

jobs:
    build-and-release:
        name: Build APK and Create GitHub Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
                submodules: recursive

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                distribution: "temurin"
                java-version: 21

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Make Gradle wrapper executable
              run: chmod +x gradlew

            - name: Build Gplay Debug APK
              run: |
                ./gradlew assembleGplayDebug --dependency-verification=lenient --no-configuration-cache

            - name: Determine Release Tag
              id: get_tag
              run: |
                if [ -n "${{ github.event.inputs.tag_name }}" ]; then
                  echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
                elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
                  echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
                else
                  echo "TAG_NAME=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
                fi

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
                name: ${{ github.event.inputs.release_title || steps.get_tag.outputs.TAG_NAME }}
                files: |
                    app/build/outputs/apk/gplay/debug/app-gplay-debug.apk
                generate_release_notes: true
                draft: false
                prerelease: false
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
